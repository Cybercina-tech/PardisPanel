  <script>
    (function() {
      const stored = localStorage.getItem('mrexchange-theme') || localStorage.getItem('smartexchange-theme');
      const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      if (stored === 'light' || (stored === undefined && prefersLight)) {
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
      }
      // Restore locale direction before first paint; keep in sync with
      // src/i18n/index.js (SUPPORTED_LOCALES / RTL_LOCALES).
      var supported = ['en', 'fa', 'ar', 'de', 'fr', 'es', 'tr'];
      var locale = localStorage.getItem('mrexchange-locale') || localStorage.getItem('smartexchange-locale') || 'en';
      if (supported.indexOf(locale) === -1) locale = 'en';
      document.documentElement.lang = locale;
      document.documentElement.dir = (locale === 'fa' || locale === 'ar') ? 'rtl' : 'ltr';
    })();
  </script>
